name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    name: QA (lint, typecheck, test)
    runs-on: ubuntu-latest
    # A hung test would otherwise hold the runner for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Cache the cloned+built OGDF so most runs skip the ~2 min build.
      # Keyed on the bootstrap script (which pins the OGDF tag).
      - name: Cache OGDF
        uses: actions/cache@v6
        with:
          path: thirdparty/ogdf
          key: ogdf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap_ogdf.py', 'scripts/ogdf-tag.txt', 'scripts/ogdf-commit.txt') }}

      - name: Bootstrap OGDF
        run: python3 scripts/bootstrap_ogdf.py

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (builds the extension)
        run: uv sync --dev

      - name: Lint with ruff
        run: uv run ruff check src/ tests/ scripts/

      - name: Check formatting with ruff
        run: uv run ruff format --check src/ tests/ scripts/

      - name: Type check with mypy
        run: uv run mypy src/ogdf tests/ scripts/

      - name: Run tests
        run: uv run pytest tests/ -v -o faulthandler_timeout=300 --cov=src/ogdf --cov-report=xml

  # The QA job covers Linux on 3.13. Test the oldest and newest supported
  # Pythons on Linux and macOS, so a platform- or version-specific failure
  # shows up before the release build.
  test-matrix:
    name: Test (${{ matrix.os }} / Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    # A hung test would otherwise hold the runner for 6 hours.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Cache OGDF
        uses: actions/cache@v6
        with:
          path: thirdparty/ogdf
          key: ogdf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap_ogdf.py', 'scripts/ogdf-tag.txt', 'scripts/ogdf-commit.txt') }}

      - name: Bootstrap OGDF
        run: python3 scripts/bootstrap_ogdf.py

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ matrix.python }}

      - name: Install dependencies (builds the extension)
        run: uv sync --dev --python ${{ matrix.python }}

      - name: Run tests
        run: uv run --python ${{ matrix.python }} pytest tests/ -q -o faulthandler_timeout=300

  # --strict turns broken links and nav entries into errors, which otherwise
  # surface only at `make docs-deploy`.
  docs:
    name: Docs (mkdocs --strict)
    runs-on: ubuntu-latest
    # A hung test would otherwise hold the runner for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Cache OGDF
        uses: actions/cache@v6
        with:
          path: thirdparty/ogdf
          key: ogdf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap_ogdf.py', 'scripts/ogdf-tag.txt', 'scripts/ogdf-commit.txt') }}

      - name: Bootstrap OGDF
        run: python3 scripts/bootstrap_ogdf.py

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (builds the extension)
        run: uv sync --dev --group docs

      # The gallery page (docs/gallery.md) is generated by the demos.
      - name: Run demos
        run: uv run python demos/run_all.py

      - name: Build docs
        run: uv run --group docs mkdocs build --strict

  offline-build:
    name: Offline source build
    runs-on: ubuntu-latest
    # A hung test would otherwise hold the runner for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Without a vendored source, an offline bootstrap must fail fast and say
      # how to supply one - rather than silently reaching for the network.
      # The bootstrap is stdlib-only and must run on the system interpreter:
      # `uv run` would build the project first, and CMakeLists bootstraps OGDF
      # when it is missing, so the source would already be present here.
      - name: Offline bootstrap refuses to clone
        run: |
          set +e
          output=$(python3 scripts/bootstrap_ogdf.py --offline 2>&1)
          status=$?
          echo "$output"
          test $status -ne 0 || { echo 'expected a non-zero exit'; exit 1; }
          echo "$output" | grep -q 'network access is disabled'

      # Vendor the source once, then build from it with the network path unused.
      - name: Vendor the OGDF source
        run: python3 scripts/bootstrap_ogdf.py --clone-only

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Build from the vendored source with OGDF_OFFLINE set
        env:
          OGDF_OFFLINE: '1'
        run: |
          python3 scripts/bootstrap_ogdf.py
          uv sync --dev

      - name: Smoke-test the offline build
        env:
          OGDF_OFFLINE: '1'
        run: |
          uv run python -m ogdf
          uv run pytest tests/ -q

  windows:
    name: Build & test (Windows)
    runs-on: windows-latest
    # A hung test would otherwise hold the runner for 6 hours.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # windows-latest ships git, CMake, and MSVC; the bootstrap builds OGDF
      # with the MSVC toolchain into thirdparty/ogdf/build/Release.
      - name: Cache OGDF
        uses: actions/cache@v6
        with:
          path: thirdparty/ogdf
          key: ogdf-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap_ogdf.py', 'scripts/ogdf-tag.txt', 'scripts/ogdf-commit.txt') }}

      - name: Bootstrap OGDF
        run: python scripts/bootstrap_ogdf.py

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies (builds the extension)
        run: uv sync --dev

      - name: Run tests
        run: uv run pytest tests/ -v -o faulthandler_timeout=300

      - name: Installation report
        run: uv run python -m ogdf
