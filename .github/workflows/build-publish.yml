name: Build and Publish

on:
  push:
    # Release tags are bare versions (0.5.1), as created by `make release`.
    tags:
      - "[0-9]*"
  pull_request:
    branches: [main, master]
  # Tag pushes create a GitHub release only. Package indexes are opt-in, per
  # manual run.
  workflow_dispatch:
    inputs:
      testpypi:
        description: "Publish to TestPyPI"
        required: false
        default: false
        type: boolean
      pypi:
        description: "Publish to PyPI (after TestPyPI, if both are selected)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Build CPython 3.10-3.14; skip musllinux (OGDF is bootstrapped on
  # manylinux/glibc) and PyPy.
  CIBW_BUILD: "cp310-* cp311-* cp312-* cp313-* cp314-*"
  CIBW_SKIP: "*-musllinux_* pp*"
  # Clone + build OGDF once per platform before building any wheels. On Linux
  # this runs inside the manylinux container (git present; install cmake).
  # cibuildwheel copies the checkout, including a cache-restored thirdparty/,
  # into the container, but nothing comes back; copy the built tree to the
  # host (mounted at /host) so the cache step can save it.
  CIBW_ENVIRONMENT_PASS_LINUX: GITHUB_WORKSPACE
  CIBW_BEFORE_ALL_LINUX: >-
    (command -v cmake >/dev/null 2>&1 || pipx install cmake) &&
    python3 scripts/bootstrap_ogdf.py &&
    mkdir -p "/host${GITHUB_WORKSPACE}/thirdparty" &&
    cp -a thirdparty/ogdf "/host${GITHUB_WORKSPACE}/thirdparty/"
  CIBW_BEFORE_ALL_MACOS: python3 scripts/bootstrap_ogdf.py
  # windows-latest ships git, CMake, and MSVC; the bootstrap builds OGDF with
  # the MSVC toolchain.
  CIBW_BEFORE_ALL_WINDOWS: python scripts/bootstrap_ogdf.py
  # Exercise each wheel end-to-end (import + layouts + I/O).
  # networkx is an optional runtime dependency; install it so the wheel test
  # actually exercises the interop layer instead of skipping it.
  CIBW_TEST_REQUIRES: pytest networkx
  # Import, the installation report, and the full suite (layouts, algorithms,
  # I/O, interop, recipes) against the built wheel rather than the source tree.
  CIBW_TEST_COMMAND: >-
    python -c "import ogdf; print(ogdf.about_text())" &&
    pytest {project}/tests -v -o faulthandler_timeout=300

jobs:
  build-sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Fail before the wheel builds if the tag and pyproject.toml disagree;
      # otherwise the release would carry wheels of a different version.
      - name: Check tag matches version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="$GITHUB_REF_NAME"
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)
          echo "tag=${tag} pyproject=${version}"
          test "$tag" = "$version"

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.0

      - name: Build sdist
        run: uv build --sdist

      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          retention-days: 14

  build-wheels:
    name: Wheels (${{ matrix.os }} / ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    # A hung test would otherwise hold the runner for 6 hours.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # Native runners only -- no QEMU, no cross-compilation, so the OGDF
          # static library always matches the wheel's architecture.
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
          - os: macos-15-intel
            arch: x86_64
            macos_target: "10.15"   # C++17 libc++ (<filesystem>) needs 10.15+
          - os: macos-14
            arch: arm64
            macos_target: "11.0"
          - os: windows-latest
            arch: AMD64
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_target }}
    steps:
      - uses: actions/checkout@v7

      # Cache the cloned+built OGDF per platform/arch so reruns skip the build.
      # The cibuildwheel version selects the manylinux image (compiler, glibc)
      # and the deployment target changes the compiled objects, so both are in
      # the key.
      - name: Cache OGDF
        uses: actions/cache@v6
        with:
          path: thirdparty/ogdf
          key: ogdf-wheel-${{ runner.os }}-${{ matrix.arch }}-cibw4.1.0-${{ matrix.macos_target }}-${{ hashFiles('scripts/bootstrap_ogdf.py', 'scripts/ogdf-tag.txt', 'scripts/ogdf-commit.txt') }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.0
        env:
          CIBW_ARCHS: ${{ matrix.arch }}

      # Built for the ISA baseline, a wheel must not use AVX on x86_64 or SVE
      # on aarch64: those crash CPUs without them (see the 0.6.1 changelog).
      # x86_64 counts ymm/zmm only: objdump decodes inline Mach-O jump tables
      # as EVEX instructions on xmm16-31.
      - name: Check instruction set
        if: runner.os != 'Windows'
        shell: bash
        run: |
          case "${{ matrix.arch }}" in
            x86_64) pattern='%[yz]mm[0-9]+' ;;
            aarch64) pattern='[[:space:],{]z[0-9]+\.[bhsdq]' ;;
            *) echo "no check for ${{ matrix.arch }}"; exit 0 ;;
          esac
          status=0
          for whl in wheelhouse/*.whl; do
            dir=$(mktemp -d)
            unzip -q "$whl" 'ogdf/_core*' -d "$dir"
            for so in "$dir"/ogdf/_core*.so; do
              objdump -d --no-show-raw-insn "$so" > "$dir/asm.txt"
              count=$(grep -cE "$pattern" "$dir/asm.txt" || true)
              echo "$(basename "$whl"): $count non-baseline instructions"
              [ "$count" -eq 0 ] && continue
              grep -nE "$pattern" "$dir/asm.txt" | head -5
              status=1
            done
          done
          exit $status

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: wheelhouse/*.whl
          retention-days: 14

  collect-artifacts:
    name: Collect all build artifacts
    needs: [build-sdist, build-wheels]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: "*"
          merge-multiple: true

      - name: List all artifacts
        run: |
          echo "=== All build artifacts ==="
          ls -la dist/
          wheels=$(find dist -name '*.whl' | wc -l)
          sdists=$(find dist -name '*.tar.gz' | wc -l)
          echo "=== Wheels: ${wheels} | Sdists: ${sdists} ==="

      - name: Upload combined artifacts
        uses: actions/upload-artifact@v7
        with:
          name: all-dist
          path: dist/
          retention-days: 30

  github-release:
    name: Create GitHub release
    needs: collect-artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: all-dist
          path: dist/

      # Notes are the CHANGELOG section for this version.
      - name: Extract release notes
        run: |
          python3 scripts/release_notes.py "$GITHUB_REF_NAME" --output notes.md
          cat notes.md

      # Idempotent: a rerun replaces the assets of an existing release.
      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" dist/* --clobber
          else
            gh release create "$tag" dist/* --title "ogdf-py ${tag}" --notes-file notes.md --verify-tag
          fi

  publish-testpypi:
    name: Publish to TestPyPI
    needs: collect-artifacts
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.testpypi
    environment:
      name: testpypi
      url: https://test.pypi.org/p/ogdf-py
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: all-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  publish-pypi:
    name: Publish to PyPI
    needs: [collect-artifacts, publish-testpypi]
    runs-on: ubuntu-latest
    # always() lets this run when publish-testpypi was skipped (not selected);
    # a failed TestPyPI upload still blocks it.
    if: >-
      always() && github.event_name == 'workflow_dispatch' && inputs.pypi &&
      needs.collect-artifacts.result == 'success' &&
      contains(fromJSON('["success", "skipped"]'), needs.publish-testpypi.result)
    environment:
      name: pypi
      url: https://pypi.org/p/ogdf-py
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          name: all-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
