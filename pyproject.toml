[project]
name = "ogdf-py"
version = "0.6.1"
description = "Python bindings for the Open Graph Drawing Framework (OGDF), built with nanobind."
readme = "README.md"
license = "GPL-2.0-only OR GPL-3.0-only"
license-files = ["LICENSE", "LICENSE_GPL_v2.txt", "LICENSE_GPL_v3.txt"]
authors = [
    { name = "Shakeeb Alireza", email = "shakfu@users.noreply.github.com" }
]
requires-python = ">=3.10"
keywords = [
    "graph",
    "graph-drawing",
    "graph-layout",
    "graph-algorithms",
    "planarity",
    "ogdf",
    "visualization",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: C++",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/shakfu/ogdf-py"
Documentation = "https://shakfu.github.io/ogdf-py/"
Changelog = "https://github.com/shakfu/ogdf-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/shakfu/ogdf-py/issues"

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    # Optional at runtime; installed for tests so the interop layer is covered.
    "networkx>=3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.20",
    "twine>=6.2.0",
]
docs = [
    "mkdocs-material>=9.5.0",
]

[build-system]
# Upper bounds at the next major: a new nanobind major can change the generated
# stub or the C++ API and break sdist builds of an already released version.
requires = ["scikit-build-core>=0.12.2,<2", "nanobind>=3.0,<4"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
wheel.packages = ["src/ogdf"]
cmake.args = []
cmake.define = {}
cmake.build-type = "Release"
cmake.source-dir = "."
# No persistent build-dir: OGDF is prebuilt by scripts/bootstrap_ogdf.py, so an
# extension build only compiles the small binding sources. Using a fresh build
# directory each time avoids stale-artifact divergence between editable installs
# and wheel builds (which previously could drop recently-added functions from
# the wheel).
sdist.include = []
# Repository-only files. docs/ and demos/ stay: tests/test_docs.py reads docs/.
sdist.exclude = [".github", "TODO.md", "REVIEW.md", "site"]
# Don't ship the C++ sources inside the binary wheel.
wheel.exclude = ["**/*.cpp", "**/*.h"]


# networkx is an optional runtime dependency and ships no type stubs; the
# interop layer imports it lazily and works without it.
[[tool.mypy.overrides]]
module = ["networkx.*"]
ignore_missing_imports = true
